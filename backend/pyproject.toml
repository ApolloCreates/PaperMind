[project]
name = "researchai-backend"
version = "0.1.0"
description = "ResearchAI Backend"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "loguru>=0.7.3",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "python-multipart>=0.0.32",
    "minio>=7.2.20",
    "pymupdf>=1.28.0",
    "langchain>=1.3.12",
    "langchain-text-splitters>=1.1.2",
    "qdrant-client>=1.18.0",
    "litellm>=1.91.1",
    "sentence-transformers>=5.6.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
