version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: researchai-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: researchai
      POSTGRES_PASSWORD: researchai
      POSTGRES_DB: researchai

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: researchai-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant

    container_name: researchai-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio

    container_name: researchai-minio

    command: server /data --console-address ":9001"

    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: researchai
      MINIO_ROOT_PASSWORD: researchai123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

volumes:

  postgres-data:

  qdrant-data:

  minio-data: